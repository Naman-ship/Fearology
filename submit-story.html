
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submit Your Story | Fearology</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="story">

<header>
    <nav>
        <h2><a href="index.html">FEAROLOGY</a></h2>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
    </nav>
</header>

<main class="about-page">

    <section class="category-hero">
        <p class="tag">OPEN A NEW CASE</p>
        <h1>SHARE YOUR STORY</h1>

        <p>
            Every unexplained experience deserves
            to be heard. Tell us yours.
        </p>
    </section>

    <section class="about-panel">

        <h2>Story Submission Form</h2>

        <form id="storyForm">

            <label for="storyName">Your Name</label>
            <input type="text" id="storyName"
                placeholder="Enter your name" required>

            <label for="storyEmail">Email Address</label>
            <input type="email" id="storyEmail"
                placeholder="Enter your email" required>

            <label for="storyCategory">Category</label>

            <div class="form-group">
    <label for="storyCategory">CASE CLASSIFICATION</label>

    <select id="storyCategory" required>
        <option value="" disabled selected>
            Select the nature of your case...
        </option>
        <option value="Paranormal Experience">👁 Paranormal Experience</option>
        <option value="Urban Legend">🌑 Urban Legend</option>
        <option value="Haunted Place">🏚 Haunted Location</option>
        <option value="Unsolved Mystery">🔍 Unsolved Mystery</option>
        <option value="Personal Encounter">🩸 Personal Encounter</option>
        <option value="Cryptid & Unknown Creatures">🐾 Cryptid & Unknown Creatures</option>
        <option value="Historical Mystery">📜 Historical Mystery</option>
        <option value="Other">❓ Other Unknown Case</option>
    </select>
</div>

            <label for="storyTitle">Story Title</label>
            <input type="text" id="storyTitle"
                placeholder="Enter story title" required>

            <label for="storyDescription">Your Story</label>
            <textarea id="storyDescription"
                rows="10"
                placeholder="Write your complete story..."
                required></textarea>

            <button type="submit" class="about-button">
                SUBMIT TO FEAROLOGY →
            </button>

            <p class="form-note">
                Your email application will open with your
                submission details ready to send.
            </p>

        </form>

    </section>

</main>

<script src="about.js"></script>

</body>
</html>
