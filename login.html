
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Fearology</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body class="auth">

<header>
    <nav>
        <h2>
            <a href="index.html">FEAROLOGY</a>
        </h2>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="signup.html">Sign Up</a></li>
        </ul>
    </nav>
</header>

<main class="auth-page">

    <section class="auth-card">

        <p class="tag">WELCOME BACK, INVESTIGATOR</p>

        <h1>THE ARCHIVE AWAITS</h1>

        <p class="auth-description">
            Your journey into the unexplained continues. The unknown awaits.

        <form id="loginForm">

            <div class="auth-group">
                <label for="loginEmail">EMAIL ADDRESS</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="auth-group">
                <label for="loginPassword">PASSWORD</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                    <button
    type="button"
    class="toggle-password"
    data-target="loginPassword"
    aria-label="Show password"
    aria-pressed="false"
>
    <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
        <circle cx="12" cy="12" r="3"/>
    </svg>
</button>
                </div>
            </div>

            <button type="submit" class="auth-button">
                LOGIN TO FEAROLOGY
            </button>

        </form>

        <p class="auth-switch">
            New to the Fearology?
            <a href="signup.html">Create an account</a>
        </p>

        <a href="index.html" class="back-home">
            ← RETURN TO HOME
        </a>

        <p class="auth-note">
            FEAROLOGY INVESTIGATION ARCHIVE
        </p>

    </section>

</main>

<script src="auth.js"></script>

</body>
</html>
